<div style="background:#fff0f6;padding:15px;border-radius:18px;margin:15px 0;text-align:center"><h3>🔍 ابحثي عن صورة أو ملصق</h3><input id="imageSearch" type="search" placeholder="مثلاً: ورد، قطة، فراشة..." style="width:90%;padding:12px;border:2px solid #f3a6c8;border-radius:12px"><button onclick="searchImages()" style="margin:8px;padding:12px 20px;border:0;border-radius:12px;background:#f3a6c8;color:white">بحث 🔍</button><div id="searchResults"></div></div><script>async function searchImages(){const q=document.getElementById('imageSearch').value.trim(),r=document.getElementById('searchResults');if(!q)return;r.innerHTML='جاري البحث... 🔎';const d=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url&iiurlwidth=180&format=json&origin=*').then(x=>x.json());r.innerHTML=Object.values(d.query?.pages||{}).map(p=>'<img src="'+p.imageinfo[0].thumburl+'" style="width:100px;height:100px;object-fit:cover;margin:5px;border-radius:10px">').join('')||'ما لقينا نتائج 😅'}</script>!doctype html><html<body lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><امونه</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">تصميمي امونه</div><nav><button onclick="show('home')">الرئيسية</button><button onclick="show('editor')">🎨 المحرر</button><button onclick="show('designs')">📂 تصاميمي</button></nav></header><main><section id="home" class="page active"><div class="hero"><div><p>🎨 موقعك الإبداعي</p><h1>صمّم فكرتك بطريقتك 💗</h1><p>أنشئ تصاميم وخلفيات بسهولة.</p><button class="primary" onclick="show('editor')">➕ ابدأ تصميمًا جديدًا</button></div><div class="preview">🌷<br><b>تصميمي<br>منوش</b></div></div><h2>✨ أمثلة التصميمات</h2><div class="cards"><article class="card"><div class="thumb pink">🌸</div><b>وردي ناعم</b><button onclick="show('editor')">استخدام</button></article><article class="card"><div class="thumb green">🌿</div><b>نباتي</b><button onclick="show('editor')">استخدام</button></article><article class="card"><div class="thumb purple">🎀</div><b>لطيف</b><button onclick="show('editor')">استخدام</button></article></div></section><section id="editor" class="page"><div class="editor-head"><button onclick="show('home')">← رجوع</button><h2>🎨 محرر التصميم</h2><button class="primary" onclick="saveDesign()">💾 حفظ</button></div><div class="editor"><aside class="tools"><button onclick="addText()">✍️ نص</button><label>🖼️ صورة<input id="image" type="file" accept="image/*"></label><button onclick="addHeart()">💗 عنصر</button><button onclick="changeBg()">🎨 خلفية</button><button onclick="clearCanvas()">🗑️ مسح</button><button onclick="download()">⬇️ تنزيل</button></aside><div class="canvasbox"><canvas id="canvas" width="360" height="640"></canvas></div></div></section><section id="designs" class="page"><h2>📂 تصاميمي</h2><div id="list" class="cards"></div></section></main><footer>🌸 تصميمي منوش — V1</footer><script src="app.js"></script></body></html>
