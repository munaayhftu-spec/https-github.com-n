<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصميمي منوش 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff1f7;
      color: #8f315f;
      text-align: center;
    }

    header {
      padding: 35px 15px 20px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    p {
      font-size: 19px;
    }

    .editor {
      padding: 15px;
    }

    .canvas {
      width: 300px;
      height: 500px;
      margin: 20px auto;
      background: #ffdce9;
      border: 5px solid #e58ab5;
      border-radius: 25px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 25px rgba(180, 80, 130, 0.15);
    }

    #designCanvas {
      width: 300px;
      height: 500px;
      display: block;
    }

    .tools {
      max-width: 700px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    button {
      border: none;
      background: #e58ab5;
      color: white;
      padding: 16px 22px;
      border-radius: 22px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .ideas {
      padding: 25px 15px;
    }

    .idea {
      display: inline-block;
      background: white;
      padding: 20px 30px;
      margin: 8px;
      border-radius: 22px;
      font-size: 19px;
    }

    footer {
      padding: 35px 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌷 تصميمي منوش 💗</h1>
    <p>حوّلي أفكارك إلى تصاميم جميلة ✨</p>
  </header>

  <section class="editor">
    <h2>🎨 محرر التصميم</h2>

    <div class="canvas">
      <canvas id="designCanvas" width="300" height="500"></canvas>
    </div>

    <div class="tools">

      <button onclick="addText()">✏️ إضافة نص</button>

      <button onclick="changeBg()">🎨 تغيير الخلفية</button>

      <button onclick="document.getElementById('imageInput').click()">
        🖼️ إضافة صورة
      </button>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="addImage(event)"
      >

      <button onclick="downloadDesign()">⬇️ تحميل</button>

    </div>
  </section>

  <section class="ideas">
    <h2>💗 أفكار جاهزة</h2>

    <div class="idea">🌷 وردي ناعم</div>
    <div class="idea">🌿 نباتي</div>
    <div class="idea">🦋 لطيف</div>
    <div class="idea">✨ اقتباسات</div>
  </section>

  <footer>
    🌷 تصميمي منوش — صمميها بطريقتك 💗
  </footer>

  <script>
    const canvas = document.getElementById("designCanvas");
    const ctx = canvas.getContext("2d");

    function resetDesign() {
      ctx.fillStyle = "#ffdce9";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#a7356c";
      ctx.font = "bold 30px Arial";
      ctx.fillText("تصميمي منوش", 150, 240);

      ctx.font = "55px Arial";
      ctx.fillText("🌷", 150, 180);
    }

    resetDesign();

    function addText() {
      const text = prompt("اكتبي النص الذي تريدينه 💗");

      if (text) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#8f315f";
        ctx.font = "bold 25px Arial";
        ctx.fillText(text, 150, 430);
      }
    }

    function changeBg() {
      const color = prompt(
        "اكتبي لون الخلفية، مثال: #ffdce9",
        "#ffdce9"
      );

      if (color) {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function addImage(event) {
      const file = event.target.files[0];

      if (!file) return;

      const image = new Image();

      image.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const scale = Math.min(
          canvas.width / image.width,
          canvas.height / image.height
        );

        const width = image.width * scale;
        const height = image.height * scale;

        const x = (canvas.width - width) / 2;
        const y = (canvas.height - height) / 2;

        ctx.drawImage(image, x, y, width, height);

        event.target.value = "";
      };

      image.src = URL.createObjectURL(file);
    }

    function downloadDesign() {
      const link = document.createElement("a");

      link.download = "تصميمي-منوش.png";
      link.href = canvas.toDataURL("image/png");

      link.click();
    }
  </script>

</body>
</html>
