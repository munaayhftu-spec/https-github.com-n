<script>
const canvas = document.getElementById("designCanvas");
const ctx = canvas.getContext("2d");

function resetDesign() {
  ctx.fillStyle = "#ffdce9";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = "center";
  ctx.fillStyle = "#a7356c";
  ctx.font = "bold 30px Arial";
  ctx.fillText("تصميمي منوش", canvas.width / 2, canvas.height / 2);

  ctx.font = "55px Arial";
  ctx.fillText("🌷", canvas.width / 2, canvas.height / 2 - 60);
}

resetDesign();

function addText() {
  const text = prompt("اكتبي النص الذي تريدينه 💗");
  const size = document.getElementById("textSize").value;
  const color = document.getElementById("textColor").value;
  const font = document.getElementById("textFont").value;

  if (text) {
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.font = "bold " + size + "px " + font;
    ctx.fillText(text, canvas.width / 2, canvas.height - 70);
  }
}

function addSticker() {
  const sticker = prompt("اكتبي الإيموجي الذي تريدينه 🌸");

  if (sticker) {
    ctx.font = "55px Arial";
    ctx.textAlign = "center";
    ctx.fillText(sticker, canvas.width / 2, canvas.height / 2);
  }
}

function addReadySticker(sticker) {
  ctx.font = "55px Arial";
  ctx.textAlign = "center";
  ctx.fillText(sticker, canvas.width / 2, canvas.height / 2);
}

function setSize(width, height) {
  canvas.width = width;
  canvas.height = height;

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  const box = canvas.parentElement;
  box.style.width = width + "px";
  box.style.height = height + "px";

  resetDesign();
}

function changeBg(color) {
  if (color) {
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
    }

function addImage(event) {
  const file = event.target.files[0];

  if (!file) return;

  const image = new Image();

  image.onload = function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scale = Math.min(
      canvas.width / image.width,
      canvas.height / image.height
    );

    const width = image.width * scale;
    const height = image.height * scale;

    const x = (canvas.width - width) / 2;
    const y = (canvas.height - height) / 2;

    ctx.drawImage(image, x, y, width, height);

    URL.revokeObjectURL(image.src);
  };

  image.src = URL.createObjectURL(file);
}

function downloadDesign() {
  canvas.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "تصميمي-منوش.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);
  }, "image/png");
}

function saveDesign() {
  const saved = JSON.parse(
    localStorage.getItem("manoushDesigns") || "[]"
  );

  saved.push(canvas.toDataURL("image/png"));

  localStorage.setItem(
    "manoushDesigns",
    JSON.stringify(saved)
  );

  alert("تم حفظ التصميم في تصاميمي 💗");
  showSavedDesigns();
}

function showSavedDesigns() {
  const box = document.getElementById("savedDesigns");

  if (!box) return;

  box.innerHTML = "";

  const saved = JSON.parse(
    localStorage.getItem("manoushDesigns") || "[]"
  );

  saved.forEach(function(src) {
    const img = document.createElement("img");

    img.src = src;
    img.style.width = "150px";
    img.style.margin = "10px";
    img.style.borderRadius = "15px";
img.style.cursor = "pointer";
img.onclick = function() {
  window.open(src, "_blank");
};
    box.appendChild(img);
  });
}

function clearDesigns() {
  localStorage.removeItem("manoushDesigns");
  showSavedDesigns();
}

showSavedDesigns();
</script>
