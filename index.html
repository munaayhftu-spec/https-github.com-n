<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><امونه</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">تصميمي امونه</div><nav><button onclick="show('home')">الرئيسية</button><button onclick="show('editor')">🎨 المحرر</button><button onclick="show('designs')">📂 تصاميمي</button></nav></header><main><section id="home" class="page active"><div class="hero"><div><p>🎨 موقعك الإبداعي</p><h1>صمّم فكرتك بطريقتك 💗</h1><p>أنشئ تصاميم وخلفيات بسهولة.</p><button class="primary" onclick="show('editor')">➕ ابدأ تصميمًا جديدًا</button></div><div class="preview">🌷<br><b>تصميمي<br>منوش</b></div></div><h2>✨ أمثلة التصميمات</h2><div class="cards"><article class="card"><div class="thumb pink">🌸</div><b>وردي ناعم</b><button onclick="show('editor')">استخدام</button></article><article class="card"><div class="thumb green">🌿</div><b>نباتي</b><button onclick="show('editor')">استخدام</button></article><article class="card"><div class="thumb purple">🎀</div><b>لطيف</b><button onclick="show('editor')">استخدام</button></article></div></section><section id="editor" class="page"><div class="editor-head"><button onclick="show('home')">← رجوع</button><h2>🎨 محرر التصميم</h2><button class="primary" onclick="saveDesign()">💾 حفظ</button></div><div class="editor"><aside class="tools"><button onclick="addText()">✍️ نص</button><label>🖼️ صورة<input id="image" type="file" accept="image/*"></label><button onclick="addHeart()">💗 عنصر</button><button onclick="changeBg()">🎨 خلفية</button><button onclick="clearCanvas()">🗑️ مسح</button><button onclick="download()">⬇️ تنزيل</button></aside><div class="canvasbox"><canvas id="canvas" width="360" height="640"></canvas></div></div></section><section id="designs" class="page"><h2>📂 تصاميمي</h2><div id="list" class="cards"></div></section></main><footer>🌸 تصميمي منوش — V1</footer><script src="app.js"></script></body></html>
